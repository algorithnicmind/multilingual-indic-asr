acoustic_model:
  architecture: cnn_bilstm
  cnn:
    channels:
    - 16
    - 32
    kernel_size: 3
    num_layers: 2
    padding: 1
    stride: 1
  lstm:
    bidirectional: true
    dropout: 0.1
    hidden_size: 64
    num_layers: 1
  output:
    type: ctc
  training:
    batch_size: 8
    early_stopping:
      min_delta: 0.01
      patience: 2
    epochs: 2
    gradient_clip: 5.0
    learning_rate: 0.001
    weight_decay: 0.0001
audio:
  bit_depth: 16
  channels: 1
  format: wav
  max_duration: 30
  min_duration: 0.5
  sample_rate: 16000
decoder:
  beam_search:
    alpha: 0.6
    beam_width: 10
    beta: 0.0
  output:
    merge_repeated: true
    remove_blanks: true
  type: beam_search
  viterbi:
    prune_threshold: 0.001
evaluation:
  metrics:
  - wer
  - cer
  - accuracy
  test_split: 0.1
features:
  mfcc:
    fmax: 8000
    fmin: 20
    hop_length: 160
    n_fft: 512
    n_mels: 40
    n_mfcc: 13
    win_length: 400
  normalize_features: true
  use_delta: true
  use_delta_delta: true
inference:
  batch_size: 1
  output_format: json
  use_gpu: true
language_id:
  model_type: svm
  neural:
    dropout: 0.1
    hidden_size: 64
    num_layers: 1
  svm:
    C: 1.0
    gamma: scale
    kernel: rbf
  training:
    batch_size: 16
    epochs: 5
    learning_rate: 0.001
    validation_split: 0.2
language_model:
  ngram:
    discount: 0.75
    order: 3
    smoothing: kneser_ney
  rnn:
    dropout: 0.3
    hidden_size: 256
    num_layers: 2
  type: ngram
  vocabulary:
    eos_token: <EOS>
    max_size: 50000
    min_frequency: 2
    pad_token: <PAD>
    sos_token: <SOS>
    unk_token: <UNK>
logging:
  file: logs/training.log
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  level: INFO
paths:
  data:
    processed: data/processed
    raw: C:/Users/ankit/OneDrive/Documents/GitHub/multilingual-indic-asr/data/raw_mini
    transcripts: data/transcripts
  logs: logs
  models:
    acoustic: models/acoustic
    language: models/language
    language_id: models/language_id
  outputs: outputs
preprocessing:
  normalize: true
  pre_emphasis: 0.97
  remove_silence: true
  silence_min_duration: 0.1
  silence_threshold: 0.01
project:
  languages:
  - english
  - hindi
  - odia
  name: Multilingual Indic ASR
  version: 1.0.0
training:
  checkpointing:
    max_checkpoints: 5
    save_best: true
    save_interval: 5
  device: auto
  mixed_precision: true
  num_workers: 0
  pin_memory: true
  seed: 42
